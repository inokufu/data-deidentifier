name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:
# Uncomment to activate regular checks:
#  schedule:
#    - cron: "0 0 * * 0"  # Weekly on Sundays

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        id: setup-uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: make install

      - name: Cache pre-commit
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit checks
        run: make precommit

      - name: Lint GitHub Actions
        uses: eifinger/actionlint-action@v1

  test:
    name: Test Python
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        id: setup-uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: make install

      - name: Run tests with coverage
        run: make test

      - name: Upload coverage report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          retention-days: 7
          path: |
            htmlcov/
            coverage.xml

  build-and-push:
    name: Build and Push Docker image
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Scaleway Container Registry
        uses: docker/login-action@v3
        with:
          registry: rg.fr-par.scw.cloud
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Get short SHA
        id: sha
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          push: true
          tags: rg.fr-par.scw.cloud/deidentification/ddi:${{ steps.sha.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Uncomment if not using ArgoCD Image Updater:
      # - name: Setup Kustomize
      #   uses: imranismail/setup-kustomize@v2
      #
      # - name: Update image tag in kustomization
      #   run: |
      #     cd kubernetes/overlays/prod
      #     kustomize edit set image ddi=rg.fr-par.scw.cloud/deidentification/ddi:${{ steps.sha.outputs.tag }}
      #
      # - name: Commit and push
      #   run: |
      #     git config user.name "github-actions[bot]"
      #     git config user.email "github-actions[bot]@users.noreply.github.com"
      #     git add kubernetes/overlays/prod/kustomization.yaml
      #     git commit -m "🚀 Deploy ${{ steps.sha.outputs.tag }} to prod"
      #     git push

  greeting:
    name: Greet first-time contributors
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'issues'
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          pr-message: 'Hello @${{ github.actor }}, thank you for submitting a PR! We will review it soon.'
          issue-message: |
            Hello @${{ github.actor }}, thank you for your interest in our project!
            If this is a bug report, please provide screenshots and steps to reproduce your issue.
