---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: staging
namePrefix: staging-

resources:
  - ../../base
  - namespace.yaml


configMapGenerator:
  - behavior: merge
    literals:
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - WORKERS_COUNT=2
    name: ddi-config

labels:
  - includeSelectors: true
    pairs:
      environment: staging

patches:
  - path: patches/ddi-deployment-patch.yaml
  - path: patches/ddi-ingress-patch.yaml

images:
  - name: ddi
    newName: rg.fr-par.scw.cloud/inokufu/ddi
    newTag: staging-latest
