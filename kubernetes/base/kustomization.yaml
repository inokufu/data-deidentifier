---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ddi-deployment.yaml
  - ddi-service.yaml
  - ddi-ingress.yaml

configMapGenerator:
  - name: ddi-config
    literals:
      - DEFAULT_ENTITY_TYPES=["PERSON", "EMAIL_ADDRESS", "PHONE_NUMBER", "LOCATION", "IP_ADDRESS", "MEDICAL_LICENSE"]

images:
  - name: ddi
