[project]
name = "data_deidentifier"
version = "1.5.0"
description = "Solution for anonymizing textual and structured data"
authors = [
  { name = "Inokufu", email = "contact@inokufu.com" }
]
readme = "docs/README.md"
requires-python = ">= 3.13"

dependencies = [
    "en-core-web-lg",
    "fr-core-news-lg",
    "logger",
    "configcore",
    "observability[sentry]",
    "pip>=26.3,<27.0",
    "presidio-analyzer>=2.2.366,<3.0.0",
    "presidio-anonymizer>=2.2.366,<3.0.0",
    "presidio-structured>=0.0.10,<0.0.11",
    "spacy>=3.8.18,<4.0.0",
    "uvicorn[standard]>=0.54.0,<0.55.0",
    "gunicorn>=27.0.1,<28.0.0",
    "fastapi>=0.165.0,<0.166.0",
    "httpx>=0.28.1,<0.29.0",
    "tenacity>=9.2.1,<10.0.0",
]

[dependency-groups]
dev = [
    "diff-cover>=11.0.4,<12.0.0",
    "griffe-inherited-docstrings>=1.1.4,<2.0.0",
    "mkdocs>=1.6.1,<2.0.0",
    "mkdocs-material>=9.8.2,<10.0.0",
    "mkdocstrings-python>=2.0.11,<3.0.0",
    "prek>=0.5.11,<0.6.0",
    "pytest>=9.2.0,<10.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
    "pytest-mock>=3.17.0,<4.0.0",
    "ruff>=0.17.6,<0.18.0",
    "ty>=0.0.108,<0.0.109",
]

[tool.uv]
add-bounds = "major"
package = true

[tool.uv.sources]
logger = { git = "https://github.com/inokufu/python-logger", tag = "v0.4.0" }
configcore = { git = "https://github.com/inokufu/python-config", tag = "v0.4.0" }
observability = { git = "https://github.com/inokufu/python-observability", branch = "feature/observability" }
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl" }
fr-core-news-lg = { url = "https://github.com/explosion/spacy-models/releases/download/fr_core_news_lg-3.8.0/fr_core_news_lg-3.8.0-py3-none-any.whl" }

[project.scripts]
start = "data_deidentifier.__main__:main"
test = "pytest:main"

[tool.ruff]
output-format = "concise"
target-version = "py313"
line-length = 88
indent-width = 4

lint.pydocstyle.convention = "google"
lint.flake8-bandit.check-typed-exception = true
lint.flake8-type-checking.strict = true

lint.select = ["ALL"]
lint.ignore = [
  "PLE1205", # logging-too-many-args
  "D100", # pydocstyle
  "EM", # flake8-errmsg
  "INP001", # implicit-namespace-package
  "TRY003", # raise-vanilla-args
  "TRY401", # verbose-log-message
  "TC", # type-checking blocks
  "CPY", # flake8-copyright
]
lint.extend-unfixable = [
  "TC002", # typing-only-third-party-import
  "TRY400", # error-instead-of-exception
  "SIM105", # suppressible-exception
]

[tool.ruff.lint.extend-per-file-ignores]
"tests/*" = [
    "S101", # Asserts allowed in tests...
    "ARG", # Unused function args -> fixtures nevertheless are functionally relevant...
    "FBT", # Don't care about booleans as positional arguments in tests, e.g. via @pytest.mark.parametrize()
    "PLR2004", # Magic value used in comparison, ...
    "S311", # Standard pseudo-random generators are not suitable for cryptographic purposes
    "S105", # Hardcoded secrets are dummy test fixtures...
    "S106", # ...idem for secrets passed as arguments
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
addopts = ["--cov=src", "--cov-report=term-missing", "--cov-report=xml"]

[tool.coverage.report]
exclude_also = [
  "@(abc\\.)?abstractmethod",
]

[tool.setuptools.package-data]
data_deidentifier = ["**/*.yaml"]
