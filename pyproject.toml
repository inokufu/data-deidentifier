[project]
name = "data_deidentifier"
version = "1.1.2"
description = "Solution for anonymizing textual and structured data"
authors = [
  { name = "Inokufu", email = "contact@inokufu.com" }
]
readme = "docs/README.md"
requires-python = ">= 3.13"

dependencies = [
    "pip>=26.0.1,<26.1.0",
    "presidio-analyzer>=2.2.361,<2.3.0",
    "presidio-anonymizer>=2.2.361,<2.3.0",
    "presidio-structured>=0.0.6,<0.0.7",
    "spacy>=3.8.11,<3.9.0",
    "en-core-web-lg",
    "fr-core-news-lg",
    "uvicorn[standard]>=0.41.0,<0.41.1",
    "gunicorn>=25.1.0,<25.2.0",
    "fastapi>=0.135.1,<0.135.2",
    "httpx>=0.28.1,<0.28.2",
    "tenacity>=9.1.4,<9.2.0",
    "logger",
    "configcore",
]

[dependency-groups]
dev = [
    "diff-cover>=10.2.0,<10.3.0",
    "griffe-inherited-docstrings>=1.1.3,<1.2.0",
    "mkdocs>=1.6.1,<1.7.0",
    "mkdocs-material>=9.6.23,<9.7.0",
    "mkdocstrings-python>=1.18.2,<1.19.0",
    "pre-commit>=4.5.1,<4.6.0",
    "pytest>=9.0.2,<9.1.0",
    "pytest-cov>=7.0.0,<7.1.0",
    "pytest-mock>=3.15.1,<3.16.0",
    "ruff>=0.15.4,<0.15.5",
    "ty>=0.0.20,<0.0.21",
]

[tool.uv]
add-bounds = "minor"
package = true

[tool.uv.sources]
logger = { git = "https://github.com/inokufu/python-logger", tag = "v0.2.1" }
configcore = { git = "https://github.com/inokufu/python-config", tag = "v0.2.1" }
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl" }
fr-core-news-lg = { url = "https://github.com/explosion/spacy-models/releases/download/fr_core_news_lg-3.8.0/fr_core_news_lg-3.8.0-py3-none-any.whl" }

[project.scripts]
start = "data_deidentifier.__main__:main"
test = "pytest:main"

[tool.ruff]
output-format = "concise"
target-version = "py313"
line-length = 88
indent-width = 4

lint.pydocstyle.convention = "google"
lint.flake8-bandit.check-typed-exception = true
lint.flake8-type-checking.strict = true

lint.select = ["ALL"]
lint.ignore = [
  "PLE1205", # logging-too-many-args
  "D100", # pydocstyle
  "EM", # flake8-errmsg
  "INP001", # implicit-namespace-package
  "TRY003", # raise-vanilla-args
  "TRY401", # verbose-log-message
  "TC", # type-checking blocks
]
lint.extend-unfixable = [
  "TC002", # typing-only-third-party-import
  "TRY400", # error-instead-of-exception
  "SIM105", # suppressible-exception
]

[tool.ruff.lint.extend-per-file-ignores]
"tests/*" = [
    "S101", # Asserts allowed in tests...
    "ARG", # Unused function args -> fixtures nevertheless are functionally relevant...
    "FBT", # Don't care about booleans as positional arguments in tests, e.g. via @pytest.mark.parametrize()
    "PLR2004", # Magic value used in comparison, ...
    "S311", # Standard pseudo-random generators are not suitable for cryptographic purposes
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
addopts = ["--cov=src", "--cov-report=term", "--cov-report=xml"]

[tool.coverage.report]
exclude_also = [
  "@(abc\\.)?abstractmethod",
]

[tool.setuptools.package-data]
data_deidentifier = ["**/*.yaml"]
